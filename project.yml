name: PosterLab
options:
  bundleIdPrefix: com.posterlab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1.1.1"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  PosterLab:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "PosterLab"
        PRODUCT_BUNDLE_IDENTIFIER: com.posterlab.app
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
  PosterLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: PosterLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.posterlab.app.tests

schemes:
  PosterLab:
    build:
      targets:
        PosterLab: all
    test:
      targets:
        - PosterLabTests
